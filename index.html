<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">h</div><div><div class="brand-name">hearth</div><div class="brand-sub">care, held together</div></div></div>
      <div class="side-label">Workspace</div>
      <nav class="nav" id="navigation" aria-label="Main navigation"></nav>
      <div class="side-bottom"><div class="help-card"><strong>Need a human?</strong><p>Your care team is one message away. We can help connect you.</p><button data-action="contact">Contact support</button></div><div class="side-profile"><div class="avatar sm" id="profile-avatar">AM</div><div class="profile-copy"><strong id="profile-name">Alex Morgan</strong><span id="profile-role">Patient account</span></div><button class="dots" aria-label="Account options" data-action="auth">···</button></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="crumb">Workspace <span style="padding:0 7px;color:#b4bcb5">/</span><strong id="crumb-page">Overview</strong></div><div class="top-actions"><label class="search"><span>⌕</span><input id="search-input" type="search" placeholder="Search care, people, files" aria-label="Search"></label><button class="icon-btn" title="Notifications" aria-label="Notifications" data-action="notifications">♧<i class="notify-dot"></i></button><div class="role-select"><span>View as</span><select id="role-switch" aria-label="Switch role"><option value="patient">Patient</option><option value="volunteer">Volunteer</option><option value="doctor">Clinician</option><option value="unit">Care unit</option></select></div><button class="account-btn" data-action="auth">Sign in</button></div></header>
      <div class="content-layout"><section class="content" id="content" aria-live="polite"></section><aside class="assistant" id="assistant"></aside></div>
    </main>
  </div>
  <div id="modal-root"></div><div id="toast-root" aria-live="polite"></div>
  <script src="/api.js"></script>
  <script src="/backend-ui.js"></script>
  <script>
    const state={role:'patient',page:'Overview',taken:false,volunteerRequested:false,accepted:new Set(),appointments:{},available:true,files:[{name:'Medication list.pdf',type:'Medication',date:'Today'},{name:'Dr. Patel visit notes.pdf',type:'Visit notes',date:'Oct 11'},{name:'Nutrition plan.pdf',type:'Care plan',date:'Oct 08'}],chat:[{from:'ai',text:'Hi Alex. I can help you find information in your care plan and connect you to your team. What would be useful right now?'}],userName:'Alex Morgan'};
    const roleMeta={patient:{title:'Patient',first:'Alex'},volunteer:{title:'Volunteer',first:'Jordan'},doctor:{title:'Clinician',first:'Dr. Maya'},unit:{title:'Care unit',first:'Harbor House'}};
    const navItems={patient:[['Overview','⌂'],['My care plan','♡'],['Appointments','▦'],['My files','▤'],['Volunteer help','✳']],volunteer:[['Overview','⌂'],['Nearby requests','⌖'],['My visits','▦'],['Messages','✉']],doctor:[['Overview','⌂'],['Appointments','▦'],['Patients','♧'],['Availability','◷'],['Volunteers','✳']],unit:[['Overview','⌂'],['Residents','♧'],['Care team','✳'],['Schedule','▦'],['Reports','▤']]};
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const dateLabel=new Intl.DateTimeFormat('en',{weekday:'long',month:'long',day:'numeric'}).format(new Date());
    function navRender(){document.getElementById('navigation').innerHTML=navItems[state.role].map(([label,icon])=>`<button class="nav-btn ${state.page===label?'active':''}" data-page="${label}" aria-label="${label}" title="${label}"><span class="nav-icon">${icon}</span><span class="nav-text">${label}</span>${label==='Appointments'&&state.role==='doctor'?'<span class="nav-count">4</span>':''}</button>`).join('');document.getElementById('crumb-page').textContent=state.page;document.getElementById('profile-role').textContent=roleMeta[state.role].title+' account';document.getElementById('profile-name').textContent=state.userName;document.getElementById('profile-avatar').textContent=state.userName.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();document.getElementById('role-switch').value=state.role;}
    function pageHead(title,subtitle,extra=''){return `<div class="page-head"><div><div class="eyebrow">${roleMeta[state.role].title} workspace</div><h1>${title}</h1><p>${subtitle}</p></div>${extra||`<div class="date-label">${dateLabel}</div>`}</div>`}

tle help nearby','Request a volunteer visit when it would make today easier')}<div class="request-banner"><div class="request-symbol">✳</div><div class="request-copy"><strong>${state.volunteerRequested?'Your request is with the volunteer team':'Would a helping hand feel good today?'}</strong><p>${state.volunteerRequested?'We’ll let you know when a volunteer accepts. Your address is only shared with the assigned volunteer.':'Companionship, errands, or a little time outside. You choose what you need.'}</p></div><button class="action-btn coral" data-action="request-volunteer" ${state.volunteerRequested?'disabled':''}>${state.volunteerRequested?'Request sent':'Request a visit'}</button></div>${section('Your food & comfort plan','A gentle guide from your care team')}<div class="card"><div class="card-head"><div><h3 class="card-title">Today’s meal rhythm</h3><div class="card-desc">Personalized by your care team · Updated Oct 08</div></div><button class="mini-link" data-action="diet">Edit plan</button></div><div class="meal-grid"><div class="meal"><span>Breakfast</span><strong>Oatmeal, soft fruit<br>8:30 AM</strong></div><div class="meal"><span>Lunch</span><strong>Soup & soft bread<br>12:00 PM</strong></div><div class="meal"><span>Evening</span><strong>Small, nourishing snack<br>6:00 PM</strong></div></div></div>`}

    function appointmentsPage(){let rows=state.role==='doctor'?[['Alex Morgan','Follow-up','Today · 10:30 AM','Confirmed'],['Riley Thompson','Symptom review','Today · 11:15 AM','Needs review'],['Jamie Chen','Initial consultation','Today · 1:00 PM','Confirmed'],['Mina Khan','Care plan review','Thu · 9:30 AM','Pending']]:[['Dr. Maya Patel','Follow-up','Tomorrow · 10:30 AM','Confirmed'],['Dr. James Lee','Care coordination','Fri · 2:00 PM','Pending']];return `${pageHead('Appointments',state.role==='doctor'?'Review requests and keep your schedule up to date.':'Your visits, with time to prepare.')}<div class="toolbar" style="margin-bottom:13px"><button class="action-btn" data-action="book">${state.role==='doctor'?'Add availability':'Request an appointment'}</button><button class="action-btn outline" data-action="calendar">Calendar view</button></div><div class="card table-wrap"><table class="data-table"><thead><tr><th>${state.role==='doctor'?'Patient':'Clinician'}</th><th>Visit</th><th>When</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="pill ${r[3]==='Confirmed'?'green':r[3]==='Pending'?'yellow':'orange'}">${state.appointments[i]||r[3]}</span></td><td>${state.role==='doctor'&&r[3]!=='Confirmed'?`<button class="mini-link" data-action="appointment-accept" data-id="${i}">Accept</button><button class="mini-link" style="color:#ad5f4a" data-action="appointment-decline" data-id="${i}">Decline</button>`:'<button class="mini-link" data-action="details">Details</button>'}</td></tr>`).join('')}</tbody></table></div><div class="section-row"><div><h2 class="section-title">${state.role==='doctor'?'Your clinic hours':'Available times'}</h2><div class="section-sub">${state.role==='doctor'?'Patients can see these openings':'Choose a time that works for you'}</div></div></div><div class="card"><div class="schedule-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<div class="day ${i===1?'active':''}"><span>${d}</span><strong>${12+i}</strong>${i<5?'<i></i>':''}</div>`).join('')}</div><div class="care-note"><span class="note-icon">◷</span><p>${state.role==='doctor'?'Clinic hours: Mon–Fri, 9:00 AM–5:00 PM. Use Availability to update patients.':'Call the care team if you need help changing or preparing for your visit.'}</p></div></div>`}

    function carePlanPage(){return `${pageHead('My care plan','Your care team’s shared guide for day-to-day support.')}<div class="two-col"><div class="card"><div class="card-head"><div><h3 class="card-title">Medication routine</h3><div class="card-desc">Check with your clinician before changing any medication.</div></div><span class="pill green">Up to date</span></div><div class="medicine-card" style="margin-top:12px"><div class="med-time">8:00 AM · WITH BREAKFAST</div><div class="med-name">Acetaminophen · 500 mg</div><div class="med-meta">As listed in your care plan.</div></div><div class="medicine-card" style="margin-top:9px"><div class="med-time">12:30 PM · AFTER LUNCH</div><div class="med-name">Morphine · 5 mg</div><div class="med-meta">As listed in your care plan. Contact your care team with questions.</div></div><div class="medicine-card" style="margin-top:9px"><div class="med-time">8:00 PM · WITH EVENING MEAL</div><div class="med-name">Gabapentin · 100 mg</div><div class="med-meta">As listed in your care plan.</div></div></div><div><div class="card"><div class="card-head"><div><h3 class="card-title">Food & comfort</h3><div class="card-desc">Your team’s gentle meal suggestions</div></div><button class="mini-link" data-action="diet">Edit plan</button></div><div class="meal-grid"><div class="meal"><span>Morning</span><strong>Oatmeal, soft fruit</strong></div><div class="meal"><span>Midday</span><strong>Soup, soft bread</strong></div><div class="meal"><span>Evening</span><strong>Small nourishing snack</strong></div></div><div class="care-note"><span class="note-icon">♡</span><p>These are suggestions from your care team, not a substitute for individualized medical or nutrition advice.</p></div></div><div class="card" style="margin-top:12px"><h3 class="card-title">Your care team</h3><div class="doctor-row"><div class="doc-avatar">MP</div><div class="row-main"><strong>Dr. Maya Patel</strong><span>Palliative care physician</span></div><span class="pill green">Available</span></div><div class="doctor-row"><div class="doc-avatar">SC</div><div class="row-main"><strong>Sam Chen, RN</strong><span>Care coordinator</span></div><button class="mini-link" data-action="contact">Message</button></div></div></div></div>`}
    function volunteersPage(){return `${pageHead(state.role==='patient'?'Volunteer support':'Volunteer network','People who can bring practical help and companionship.')}<div class="card"><div class="card-head"><div><h3 class="card-title">${state.role==='patient'?'Your request':'Requests needing a volunteer'}</h3><div class="card-desc">${state.role==='patient'?'You choose what support would help.':'Coordinate with the clinician before confirming a visit.'}</div></div>${state.role==='patient'?'<button class="action-btn coral" data-action="request-volunteer">Request a visit</button>':''}</div>${state.role==='patient'?`<div class="care-note"><span class="note-icon">✳</span><p>${state.volunteerRequested?'Your request is being matched. The assigned volunteer will receive visit details.':'Request companionship, errands, transportation, or another kind of support.'}</p></div>`:`<div class="request-row"><div class="doc-avatar">AM</div><div class="row-main"><strong>Alex Morgan · Companionship</strong><span>North area · Today after 2:00 PM · Clinician: Dr. Patel</span></div><span class="pill orange">Open</span><button class="action-btn" data-action="accept-request" data-id="0">${state.accepted.has(0)?'Accepted':'Accept'}</button></div><div class="request-row"><div class="doc-avatar">ET</div><div class="row-main"><strong>Evelyn Thompson · Grocery pickup</strong><span>West area · Tomorrow · Care team contact available</span></div><span class="pill orange">Open</span><button class="action-btn" data-action="accept-request" data-id="1">${state.accepted.has(1)?'Accepted':'Accept'}</button></div>`}</div><div class="card" style="margin-top:12px"><h3 class="card-title">A thoughtful visit starts with consent</h3><div class="care-note"><span class="note-icon">♡</span><p>Patient locations and personal details should only be shared with a matched volunteer, with the patient’s permission. This demo uses approximate locations.</p></div></div>`}

    function assistantRender(){const stream=state.chat.map(m=>`<div class="message ${m.from==='ai'?'ai':'user'}"><small>${m.from==='ai'?'Hearth assistant':'You'}</small>${esc(m.text)}</div>`).join('');document.getElementById('assistant').innerHTML=`<div class="assistant-head"><div class="ai-mark">✳</div><div><h3>Hearth assistant</h3><p>Here to help you find your way</p></div><div class="online"><i></i>Ready</div></div><div class="chat-context">${roleWelcome()}</div><div class="chat-stream" id="chat-stream">${stream}</div><div class="suggestions">${({patient:['When is my next medication?','What is my next appointment?'],volunteer:['Show nearby requests','How do I contact the care team?'],doctor:['How many appointments today?','Who needs follow-up?'],unit:['How many residents need support?','Show volunteer requests']})[state.role].map(q=>`<button class="suggestion" data-question="${q}">${q}</button>`).join('')}</div><form class="chat-form" id="chat-form"><input id="chat-input" autocomplete="off" placeholder="Ask your care assistant…" aria-label="Message the care assistant"><button class="send-btn" aria-label="Send message">↑</button></form><div class="safety-copy">For urgent symptoms or emergencies, contact your local emergency service or care team. The assistant does not provide medical advice.</div>`;const streamEl=document.getElementById('chat-stream');streamEl.scrollTop=streamEl.scrollHeight}
    function answerFor(q){const text=q.toLowerCase();if(state.role==='patient'){if(/med|noon|dose|food|eat/.test(text))return 'Your care plan lists Morphine 5 mg at 12:30 PM, after lunch. Please follow the instructions from your clinician and contact your care team if anything is unclear.';if(/appoint|doctor|visit/.test(text))return 'Your next appointment is tomorrow at 10:30 AM with Dr. Maya Patel. You can see the full schedule in Appointments.';if(/file|report|document/.test(text))return `You have ${state.files.length} care files saved. Open My files to view them or upload a new report.`;if(/volunteer|help|near/.test(text))return state.volunteerRequested?'Your volunteer request has been sent to the care team for matching.':'You can request companionship, errands, or a ride in Volunteer help. Your exact location is only shared with an assigned volunteer.';return 'I can help find details in your saved care plan, appointments, files, or volunteer requests. For care decisions, please check with your clinician.'}if(state.role==='volunteer'){if(/near|request|patient/.test(text))return 'There are 8 open requests within 5 miles in this demo. Open Nearby requests to review needs. Patient details stay private until a request is accepted.';if(/doctor|team|contact/.test(text))return 'Open a request and use Message care team to coordinate. Please confirm visit arrangements with the patient’s care team.';return 'I can help you find open requests, your upcoming visits, and care team contacts.'}if(state.role==='doctor'){if(/how many|patient|left|today|appointment/.test(text))return 'Your demo schedule has 12 patients today, with 3 appointments remaining. Four items need attention, including two new messages and two reports.';if(/volunteer/.test(text))return 'Two volunteer matches are shown in your overview. Open Volunteers to coordinate support with the care team.';return 'I can summarize the demo schedule and help find appointment, patient, and volunteer coordination views. Use clinical judgment for all care decisions.'}if(/resident|support|volunteer|request/.test(text))return 'The demo overview shows 28 residents, with 4 needing follow-up and 6 volunteer requests. Two requests are still awaiting a match.';return 'I can summarize residents, team availability, and volunteer requests in the unit overview.'}

    function openModal(title,body,submit='Save'){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${title}</h2><button class="close-btn" data-action="close-modal" aria-label="Close">×</button></div>${body}<div class="modal-actions"><button class="action-btn outline" data-action="close-modal">Cancel</button><button class="action-btn" data-action="modal-submit">${submit}</button></div></div></div>`;document.querySelector('.modal-backdrop').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()})}
    function closeModal(){document.getElementById('modal-root').innerHTML=''}
    function authModal(mode='login'){const registering=mode==='register';const roleOptions=`<option value="patient" ${state.role==='patient'?'selected':''}>Patient or family member</option><option value="volunteer" ${state.role==='volunteer'?'selected':''}>Volunteer</option><option value="doctor" ${state.role==='doctor'?'selected':''}>Clinician</option><option value="unit" ${state.role==='unit'?'selected':''}>Palliative care unit</option>`;openModal(registering?'Create your Hearth account':'Sign in to Hearth',`<div class="auth-modes"><button class="auth-mode ${registering?'':'active'}" data-auth-mode="login">Sign in</button><button class="auth-mode ${registering?'active':''}" data-auth-mode="register">Create account</button></div>${registering?`<div class="form-field"><label for="auth-name">Your name</label><input id="auth-name" placeholder="e.g. Alex Morgan" value="${esc(state.userName)}"></div>`:`<input id="auth-name" type="hidden" value="${esc(state.userName)}">`}<div class="form-field"><label for="auth-email">Email address</label><input id="auth-email" type="email" placeholder="you@example.com" required></div><div class="form-field"><label for="auth-password">Password</label><input id="auth-password" type="password" placeholder="Enter your password" required></div>${registering?`<div class="form-field"><label for="auth-role">I’m joining as</label><select id="auth-role">${roleOptions}</select></div>`:`<input id="auth-role" type="hidden" value="${state.role}">`}<div class="form-hint">Demo only: credentials are not verified or saved. Real accounts require secure authentication and role verification.</div>`,'Continue')}
    document.addEventListener('click',e=>{const mode=e.target.closest('[data-auth-mode]');if(mode){e.stopPropagation();authModal(mode.dataset.authMode);return}if(e.target.closest('[data-action="modal-submit"]')&&document.getElementById('auth-email')){e.stopPropagation();const registering=document.getElementById('auth-role').type!=='hidden';const email=document.getElementById('auth-email').value.trim();const password=document.getElementById('auth-password').value;const name=document.getElementById('auth-name').value.trim();if(!email||!password||(registering&&!name)){toast('Please complete the required fields.');return}if(registering){state.userName=name;state.role=document.getElementById('auth-role').value}state.page='Overview';closeModal();render();toast('Demo profile ready. No credentials were saved.')}},true);
    function actionModal(action){if(action==='diet')openModal('Update food & comfort plan',`<div class="form-field"><label for="meal-note">What feels manageable today?</label><textarea id="meal-note" rows="3" placeholder="Share preferences with your care team"></textarea></div><div class="form-field"><label for="meal-reminder">Meal reminder</label><select id="meal-reminder"><option>Breakfast · 8:30 AM</option><option>Lunch · 12:00 PM</option><option>Evening · 6:00 PM</option><option>No reminder</option></select></div><div class="form-hint">Suggestions are not a substitute for individualized nutrition advice. Changes are saved locally in this demo.</div>`,'Save plan');else if(action==='book')openModal('Request an appointment',`<div class="form-field"><label for="book-date">Preferred date</label><input id="book-date" type="date"></div><div class="form-field"><label for="book-time">Preferred time</label><select id="book-time"><option>Morning · 9:00–12:00</option><option>Afternoon · 1:00–4:00</option><option>Video visit</option></select></div><div class="form-field"><label for="book-note">Note for your care team</label><textarea id="book-note" rows="2" placeholder="Optional"></textarea></div>`,'Send request');else if(action==='report')openModal('Patient report',`<div class="form-field"><label for="report-patient">Patient</label><select id="report-patient"><option>Alex Morgan</option><option>Riley Thompson</option><option>Jamie Chen</option></select></div><div class="form-field"><label for="report-file">Upload report</label><input id="report-file" type="file" accept=".pdf,.png,.jpg,.doc,.docx"></div><div class="form-field"><label for="report-note">Clinical note</label><textarea id="report-note" rows="3" placeholder="Add a secure note"></textarea></div><div class="form-hint">Production uploads require verified identity, patient consent, and encrypted clinical storage.</div>`,'Save report');else openModal(action==='availability'?'Set your availability':'Connect with your care team',action==='availability'?`<div class="form-field"><label for="available-state">Patient booking status</label><select id="available-state"><option>Available for appointments</option><option>Unavailable today</option></select></div><div class="form-field"><label for="available-hours">Clinic hours</label><input id="available-hours" value="Mon–Fri · 9:00 AM–5:00 PM"></div>`:`<div class="form-field"><label for="contact-message">Message</label><textarea id="contact-message" rows="4" placeholder="What would you like your care team to know?"></textarea></div><div class="form-hint">This demo does not send messages. In a care setting, use your verified care team’s secure messaging channel.</div>`,'Continue')}
    document.addEventListener('click',e=>{const role=e.target.closest('[data-page]');if(role){state.page=role.dataset.page;contentRender();return}const question=e.target.closest('[data-question]');if(question){sendChat(question.dataset.question);return}const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(a==='close-modal'){closeModal();return}if(a==='auth'){authModal();return}if(a==='modal-submit'){if(document.getElementById('auth-name')){const name=document.getElementById('auth-name').value.trim();const role=document.getElementById('auth-role').value;if(!name){toast('Please enter your name to continue.');return}state.userName=name;state.role=role;state.page='Overview';state.chat=[{from:'ai',text:`Welcome, ${name.split(' ')[0]}. ${roleWelcome()}`}];closeModal();render();toast('Demo profile ready. No account was created.');return}closeModal();toast(a==='modal-submit'?'Saved in this demo.':'Done.');return}if(a==='taken'){state.taken=true;contentRender();toast('Dose marked as taken in your demo routine.');return}if(a==='request-volunteer'){state.volunteerRequested=true;contentRender();toast('Your volunteer request was shared with the care team.');return}if(a==='accept-request'){const id=Number(el.dataset.id||0);state.accepted.add(id);contentRender();toast('Request accepted. Coordinate with the care team before the visit.');return}if(a==='appointment-accept'||a==='appointment-decline'){state.appointments[el.dataset.id]=a==='appointment-accept'?'Accepted':'Declined';contentRender();toast(`Appointment ${a.endsWith('accept')?'accepted':'declined'} in the demo.`);return}if(a==='availability'){state.available=!state.available;contentRender();toast(`Availability set to ${state.available?'open':'away'}.`);return}if(a==='diet'||a==='book'||a==='report'||a==='contact'||a==='details'||a==='calendar'||a==='unit-report'){actionModal(a);return}if(a==='navigate-care'){state.page='My care plan';contentRender();return}if(a==='volunteer-profile'){state.page='My visits';contentRender();return}if(a==='file-open'){toast(`Opening ${el.dataset.name} in this demo.`);return}if(a==='file-delete'){state.files=state.files.filter(f=>f.name!==el.dataset.name);contentRender();toast('File removed from this demo.');return}if(a==='notifications'){toast('You’re all caught up.');return}});
    document.getElementById('role-switch').addEventListener('change',e=>{state.role=e.target.value;state.page='Overview';state.chat=[{from:'ai',text:`${roleWelcome()}`}];render()});
    document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();const input=document.getElementById('chat-input');sendChat(input.value);input.value=''}});
    function sendChat(text){const q=String(text||'').trim();if(!q)return;state.chat.push({from:'user',text:q},{from:'ai',text:answerFor(q)});assistantRender()}
    document.addEventListener('change',e=>{if(e.target.id==='file-upload'){const files=[...e.target.files];files.forEach(f=>state.files.unshift({name:f.name,type:f.type.includes('pdf')?'PDF document':'Uploaded file',date:'Today'}));contentRender();if(files.length)toast(`${files.length} file${files.length===1?'':'s'} added to this demo.`)}});
    document.addEventListener('click',e=>{if(e.target.closest('[data-action="modal-submit"]')){const file=document.getElementById('report-file');if(file){e.stopPropagation();if(file.files.length){state.files.unshift({name:file.files[0].name,type:'Clinician report',date:'Today'});closeModal();toast('Report added to this demo patient record.')}else toast('Choose a report file to upload.')} }},true);
    document.getElementById('search-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){const q=e.target.value.toLowerCase();let destination=navItems[state.role].find(([n])=>n.toLowerCase().includes(q));if(!destination)destination=navItems[state.role].find(([n])=>q.includes('med')&&n==='My care plan'||q.includes('file')&&n==='My files'||q.includes('doctor')&&n==='Appointments'||q.includes('volunteer')&&n.toLowerCase().includes('volunteer'));if(destination){state.page=destination[0];contentRender()}else toast('No matching page in this demo. Try care, files, appointments, or volunteers.')}});
    function render(){contentRender();assistantRender()}render();
  </script>
</body>
</html>
